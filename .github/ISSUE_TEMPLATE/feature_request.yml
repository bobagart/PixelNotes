name: Feature request
description: Suggest an idea for PixelNotes
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to be able to do?
      description: Describe the problem first, then your idea.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried instead?
